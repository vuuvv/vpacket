# 润晟道闸门禁控制板通信协议（V1.0，2026-04-30）。
#
# 帧结构：魔数(2) + UID(12) + 方向(1) + 指令(1) + 序号(1) +
# 数据区长度(2) + 数据区 CRC16-Modbus(2) + 数据区。
# 数据区的首字节固定为应答码：0 表示成功，非 0 表示设备拒绝或执行失败。

data_structures:
  # 用户记录固定为 20 字节。保留字段必须原样保留，避免后续固件扩展时破坏记录对齐。
  UserInfo:
    fields:
      - name: "data.user.hid"
        type: "uint"
        size: 1
      - name: "data.user.pid"
        type: "uint"
        size: 2
      - name: "data.user.permission"
        type: "uint"
        size: 1
      - name: "data.user.startTimestamp"
        type: "uint"
        size: 4
      - name: "data.user.endTimestamp"
        type: "uint"
        size: 4
      - name: "data.user.reserved"
        type: "hex"
        size: 8

  # HUB 灯板显示内容的行描述占 12 字节，正文由四行内容按长度依次拼接。
  DisplayLines:
    fields:
      - name: "data.line1Length"
        type: "uint"
        size: 1
      - name: "data.line1Speed"
        type: "uint"
        size: 2
      - name: "data.line2Length"
        type: "uint"
        size: 1
      - name: "data.line2Speed"
        type: "uint"
        size: 2
      - name: "data.line3Length"
        type: "uint"
        size: 1
      - name: "data.line3Speed"
        type: "uint"
        size: 2
      - name: "data.line4Length"
        type: "uint"
        size: 1
      - name: "data.line4Speed"
        type: "uint"
        size: 2
      - name: "data.content"
        type: "hex"
        size: -1

  # TCP 客户端参数重启后才生效；调用方应在发送后安排重启，而不是假定连接会立即切换。
  TcpClientSetting:
    fields:
      - name: "data.dhcpEnabled"
        type: "uint"
        size: 1
      - name: "data.port"
        type: "uint"
        size: 2
      - name: "data.ip"
        type: "hex"
        size: 4
      - name: "data.gateway"
        type: "hex"
        size: 4
      - name: "data.subnetMask"
        type: "hex"
        size: 4

  # 复位、重启等指令只有统一应答码，显式保留该结构以避免配置编译器把空 case 当作错误。
  NoPayload:
    fields: []

protocols:
  - name: "RSBarrierAccessBoardV2"
    type: "binary"
    framing_rule:
      header_marker: "7273"
      # 数据区至少含一个应答码，因此最短完整帧为 21 + 1 字节。
      min_header_size: 22
      length_offset: 17
      length_size: 2
      length_adjustment: 21

    fields:
      - name: "deviceType"
        type: "calc"
        formula: "'board'"
      - name: "magic"
        type: "hex"
        size: 2
        default: "7273"
        check: "fields.magic == '7273'"
      - name: "sn"
        type: "hex"
        size: 12
      - name: "direction"
        flow: "encode"
        type: "calc"
        value_type: "hex"
        size: 1
        # 编码默认走查询方向 BB；只有调用方明确 write=true 时才允许生成写指令 AA。
        formula: "has(fields.write) && fields.write == true ? 'AA' : 'BB'"
      - name: "direction"
        flow: "decode"
        type: "hex"
        size: 1
        # 设备进入解码流程时默认按 CC 上报方向解释，实际字节仍会完整保留在字段中。
        default: "CC"
      - name: "command"
        type: "hex"
        size: 1
      - name: "counter"
        type: "hex"
        size: 1
        default: "00"
      - name: "dataLen"
        flow: "decode"
        type: "uint"
        size: 2
      - name: "dataLen"
        flow: "encode"
        type: "calc"
        size: 2
        round: 1
        # 数据区从 switch 跟踪的偏移处开始，不能把帧头或 CRC 字段错误计入长度。
        formula: "int(vars.packetLen) - int(offsets.dataStart)"
      - name: "dataCrc"
        crc: "crc16_modbus"
        # 数据区在协议中固定从第 22 字节（零基偏移 21）开始。解码阶段不会建立编码偏移表，
        # 因此这里使用固定偏移，避免 CRC 校验依赖仅编码阶段存在的 offsets.dataStart。
        crc_start: "21"
        crc_end: "vars.packetLen"
        size: 2
        round: 1
        # 文档中的 CRC 是数据区 CRC，不覆盖前 21 字节帧头；设备以大端字节顺序保存数值。
      # 零字节标记节点只记录数据区起点，不写入任何协议字节；这样可以移除原先
      # 仅为 track_offset 存在的 condition=true 包装，同时继续正确回填 dataLen。
      - name: "dataStart"
        type: "calc"
        size: 0
        track_offset: true
        formula: "0"
      # 应答码是每个数据区的首字节。即使查询请求没有业务参数，也必须携带该占位字节，
      # 否则设备和分帧器会对 dataLen 的含义产生歧义。
      - name: "data.code"
        flow: "decode"
        type: "uint"
        size: 1
      - name: "data.success"
        flow: "decode"
        type: "calc"
        formula: "int(fields.data.code)==0"
      - name: "data.code"
        flow: "encode"
        type: "uint"
        size: 1
        default: "00"
      - type: "switch"
        field: "command"
        cases:
          # 0x01 读取设备型号：CC 上报为型号 1 字节 + 版本号 4 字节。
          - value: "01"
            fields:
              - name: "data.deviceType"
                flow: "decode"
                type: "uint"
                size: 1
              - name: "data.version"
                flow: "decode"
                type: "hex"
                size: 4
          - value: "02"
            fields:
              - name: "data.maxFrameLength"
                flow: "decode"
                type: "uint"
                size: 2
          - value: "03"
            fields:
              - name: "data.controlGroupCount"
                flow: "decode"
                type: "uint"
                size: 1
          - value: "04"
            fields:
              - type: "if"
                flow: "encode"
                condition: "fields.direction == 'BB'"
                then:
                  - name: "data.groupNo"
                    type: "uint"
                    size: 1
              - name: "data.groupNo"
                flow: "decode"
                type: "uint"
                size: 1
              - name: "data.relayLevel"
                flow: "decode"
                type: "uint"
                size: 1
              - name: "data.openButtonLevel"
                flow: "decode"
                type: "uint"
                size: 1
              - name: "data.doorSensorLevel"
                flow: "decode"
                type: "uint"
                size: 1
          - value: "05"
            fields:
              - type: "if"
                condition: "fields.direction in ['AA', 'CC']"
                then:
                  - name: "data.enabled"
                    type: "uint"
                    size: 1
                  - name: "data.openLevel"
                    type: "uint"
                    size: 1
          - value: "06"
            fields:
              - type: "if"
                condition: "fields.direction in ['AA', 'CC']"
                then:
                  - name: "data.enabled"
                    type: "uint"
                    size: 1
                  - name: "data.openLevel"
                    type: "uint"
                    size: 1
          - value: "07"
            fields:
              - type: "if"
                condition: "fields.direction in ['AA', 'CC']"
                then:
                  - name: "data.relayCloseDurationMs"
                    type: "uint"
                    size: 4
          - value: "08"
            fields:
              - type: "if"
                flow: "encode"
                condition: "fields.direction == 'AA'"
                then:
                  - name: "data.groupNo"
                    type: "uint"
                    size: 1
                  - name: "data.relayEnabled"
                    type: "uint"
                    size: 1
          - value: "09"
            fields:
              - name: "data.flashSize"
                flow: "decode"
                type: "uint"
                size: 4
          - value: "0A"
            fields:
              - type: "if"
                flow: "encode"
                condition: "fields.direction in ['AA', 'BB']"
                then:
                  - name: "data.flashAddress"
                    type: "uint"
                    size: 4
                  - name: "data.length"
                    type: "uint"
                    size: 2
              - type: "if"
                flow: "encode"
                condition: "fields.direction == 'AA'"
                then:
                  - name: "data.flashData"
                    type: "hex"
                    size: -1
              - name: "data.flashData"
                flow: "decode"
                type: "hex"
                size_expr: "int(fields.dataLen) - 1"
          - value: "0B"
            fields:
              - name: "data.fontAddress"
                flow: "decode"
                type: "uint"
                size: 4
              - name: "data.fontSize"
                flow: "decode"
                type: "uint"
                size: 4
          - value: "0C"
            fields:
              - name: "data.fontAddress"
                flow: "decode"
                type: "uint"
                size: 4
              - name: "data.fontSize"
                flow: "decode"
                type: "uint"
                size: 4
          - value: "0D"
            fields:
              - name: "data.firmwareAddress"
                flow: "decode"
                type: "uint"
                size: 4
          - value: "0E"
            fields:
              - name: "data.audioAddress"
                flow: "decode"
                type: "uint"
                size: 4
              - name: "data.audioDataSize"
                flow: "decode"
                type: "uint"
                size: 4
              - name: "data.audioCount"
                flow: "decode"
                type: "uint"
                size: 1
          - value: "0F"
            fields:
              - type: "if"
                flow: "encode"
                condition: "fields.direction in ['AA', 'BB']"
                then:
                  - name: "data.audioNo"
                    type: "uint"
                    size: 1
              - type: "if"
                flow: "encode"
                condition: "fields.direction == 'AA'"
                then:
                  - name: "data.sampleRate"
                    type: "uint"
                    size: 1
                  - name: "data.audioLength"
                    type: "uint"
                    size: 4
              - name: "data.sampleRate"
                flow: "decode"
                type: "uint"
                size: 1
              - name: "data.audioLength"
                flow: "decode"
                type: "uint"
                size: 4
          - value: "10"
            fields:
              - type: "if"
                condition: "fields.direction in ['AA', 'CC']"
                then:
                  - name: "data.volume"
                    type: "uint"
                    size: 1
          - value: "11"
            fields:
              - type: "if"
                flow: "encode"
                condition: "fields.direction == 'AA'"
                then:
                  - name: "data.promptNo"
                    type: "uint"
                    size: 1
          - value: "12"
            fields:
              - type: "if"
                condition: "fields.direction in ['AA', 'CC']"
                then:
                  - name: "data.timestamp"
                    type: "calc"
                    size: 4
                    formula: "has(fields.timestamp) ? fields.timestamp : int(now()/1000)"
          - value: "13"
            fields:
              - type: "if"
                flow: "encode"
                condition: "fields.direction == 'AA'"
                then:
                  - name: "data.firmwareLength"
                    type: "uint"
                    size: 4
                  - name: "data.firmwareChecksum"
                    type: "uint"
                    size: 4
          - value: "14"
            fields:
              - type: "if"
                condition: "fields.direction in ['AA', 'CC']"
                then:
                  - name: "data.hubCount"
                    type: "uint"
                    size: 1
                  - name: "data.displayDirection"
                    type: "uint"
                    size: 1
          - value: "15"
            fields:
              - type: "if"
                flow: "encode"
                condition: "fields.direction == 'AA'"
                then:
                  - name: "data.durationSeconds"
                    type: "uint"
                    size: 1
                  - type: "struct"
                    ref: "DisplayLines"
          - value: "16"
            fields:
              - type: "if"
                flow: "encode"
                condition: "fields.direction in ['AA', 'BB']"
                then:
                  - name: "data.displayNo"
                    type: "uint"
                    size: 1
              - type: "if"
                flow: "encode"
                condition: "fields.direction == 'AA'"
                then:
                  - type: "struct"
                    ref: "DisplayLines"
              - type: "struct"
                flow: "decode"
                ref: "DisplayLines"
          - value: "17"
            fields:
              - type: "if"
                condition: "fields.direction in ['AA', 'CC']"
                then:
                  - name: "data.cardReportIntervalSeconds"
                    type: "uint"
                    size: 1
          - value: "18"
            fields:
              - name: "data.readerNo"
                flow: "decode"
                type: "uint"
                size: 1
              # 解码时根据 dataLen 判断五位/八位卡号；五位卡号没有 HID 字节。
              - type: "if"
                flow: "decode"
                condition: "fields.dataLen == 5"
                then:
                  - name: "data.hid"
                    flow: "decode"
                    type: "uint"
                    size: 1
              # 编码主动上报时 dataLen 尚未在第二轮回填，必须以 HID 是否存在判断，
              # 否则 CEL 会访问不存在的 dataLen 并导致八位卡号上报无法发出。
              - type: "if"
                flow: "encode"
                condition: "has(fields.data.hid)"
                then:
                  - name: "data.hid"
                    flow: "encode"
                    type: "uint"
                    size: 1
              - name: "data.pid"
                flow: "decode"
                type: "uint"
                size: 2
          - value: "19"
            fields:
              - type: "if"
                condition: "fields.direction in ['AA', 'CC']"
                then:
                  - name: "data.onlineMode"
                    type: "uint"
                    size: 1
          - value: "1A"
            fields:
              - type: "if"
                condition: "fields.direction in ['AA', 'CC']"
                then:
                  - name: "data.heartbeatIntervalMs"
                    type: "uint"
                    size: 4
          - value: "1B"
            fields:
              - type: "if"
                condition: "fields.direction in ['AA', 'CC']"
                then:
                  - name: "data.reportRetryTimeoutMs"
                    type: "uint"
                    size: 2
          - value: "1C"
            fields:
              - type: "if"
                condition: "fields.direction in ['AA', 'CC']"
                then:
                  - name: "data.sameWgIdFlashReadIntervalSeconds"
                    type: "uint"
                    size: 1
          - value: "1D"
            fields:
              - type: "if"
                flow: "encode"
                condition: "fields.direction == 'BB'"
                then:
                  - name: "data.hid"
                    type: "uint"
                    size: 1
                  - name: "data.pid"
                    type: "uint"
                    size: 2
              - type: "if"
                condition: "fields.direction in ['AA', 'CC']"
                then:
                  - type: "struct"
                    ref: "UserInfo"
          - value: "1E"
            fields:
              - type: "if"
                flow: "encode"
                condition: "fields.direction == 'AA'"
                then:
                  - name: "data.hid"
                    type: "uint"
                    size: 1
                  - name: "data.pid"
                    type: "uint"
                    size: 2
          - value: "1F"
            fields:
              - type: "struct"
                ref: "NoPayload"
          - value: "20"
            fields:
              - name: "data.userCount"
                flow: "decode"
                type: "uint"
                size: 2
          - value: "21"
            fields:
              - type: "if"
                flow: "encode"
                condition: "fields.direction == 'BB'"
                then:
                  - name: "data.userIndex"
                    type: "uint"
                    size: 2
              - type: "struct"
                flow: "decode"
                ref: "UserInfo"
          - value: "22"
            fields:
              - name: "data.userOffsetTableAddress"
                flow: "decode"
                type: "uint"
                size: 4
              - name: "data.userInfoTableAddress"
                flow: "decode"
                type: "uint"
                size: 4
          - value: "23"
            fields:
              - type: "if"
                condition: "fields.direction in ['AA', 'CC']"
                then:
                  - name: "data.userIdDigits"
                    type: "uint"
                    size: 1
          - value: "24"
            fields:
              - type: "if"
                condition: "fields.direction in ['AA', 'CC']"
                then:
                  - type: "struct"
                    ref: "TcpClientSetting"
          - value: "25"
            fields:
              - type: "if"
                flow: "encode"
                condition: "fields.direction == 'AA'"
                then:
                  - name: "data.port"
                    type: "uint"
                    size: 2
                  - name: "data.host"
                    type: "string"
                    size: -1
              - name: "data.port"
                flow: "decode"
                type: "uint"
                size: 2
              - name: "data.host"
                flow: "decode"
                type: "string"
                size_expr: "int(fields.dataLen) - 3"
          - value: "F1"
            fields:
              - type: "if"
                flow: "encode"
                condition: "fields.direction == 'AA'"
                then:
                  - name: "data.printEnabled"
                    type: "uint"
                    size: 1
          - value: "F2"
            fields:
              - type: "struct"
                ref: "NoPayload"
          - value: "F3"
            fields:
              - type: "struct"
                ref: "NoPayload"
        default_fields:
          # 未识别的固件扩展指令仍保留原始负载，以免接入新固件后整帧解码失败。
          - name: "data.raw"
            flow: "decode"
            type: "hex"
            size_expr: "int(fields.dataLen) - 1"
          - name: "data.raw"
            flow: "encode"
            type: "hex"
            size: -1

  # --- 3. DTU 心跳协议 ---
  - name: "DTUHeartbeat"
    type: "text"

    framing_rule:
      start_delimiter: "s'['"
      end_delimiter: "s']'"
      max_len: 128
    fields:
      - name: "sn"
        type: "string"
        size: -1
      - name: "command"
        type: "calc"
        formula: "'heartbeat'"
      - name: "deviceType"
        type: "calc"
        formula: "'dtu'"
